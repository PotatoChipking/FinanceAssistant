<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>机会发现 · 效果预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#202635;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1020px;margin:60px auto;padding:0 24px}.note{background:#fff7df;border:1px solid #f1dfaa;border-radius:12px;padding:14px 18px;color:#876323;margin-bottom:30px}h1{font-size:25px;margin:0 0 8px}p{color:#858b98}.panel{background:#fff;border:1px solid #e7e9ee;border-radius:18px;padding:24px;margin-top:24px}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:24px;flex-wrap:wrap}button{border:0;border-radius:7px;padding:9px 15px;background:#f0f2f6;color:#7a8190;cursor:pointer;font:inherit}button.active{background:#6563e8;color:#fff}.hint{margin-left:auto;color:#959ba6;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#f8f9fb;border-radius:12px;padding:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:16px}.name{font-size:15px;font-weight:600}.code,.caption{color:#9299a5;font-size:11px;margin-top:6px}.num{font-variant-numeric:tabular-nums;text-align:right}.up{color:#ed5274}.down{color:#16a480}.pct{font-weight:600}.chart{width:100%;height:76px;display:block;margin-top:15px}.ticks{display:flex;justify-content:space-between;color:#a0a6b0;font-size:10px}.foot{font-size:12px;color:#9299a5;margin-top:20px}@media(max-width:650px){main{margin:24px auto}.grid{grid-template-columns:1fr}.panel{padding:16px}.hint{width:100%;margin:8px 0 0}}
</style></head><body><main><div class="note">效果演示 · 以下名称、行情和走势均为示例数据，不是实时行情；无需登录。</div><h1>机会发现</h1><p>发现盘中机会，查看板块当天走势</p><section class="panel"><div class="toolbar"><button id="boards" class="active">热门板块</button><button id="stocks">热门股票</button><button id="rapid">快速涨幅</button><span class="hint" id="hint">A 股 · 当天分时走势</span></div><div class="grid" id="grid"></div><div class="foot">此页用于预览展示效果，正式首页沿用现有账户登录与行情接口。</div></section></main><script>
const boards=[['半导体','BK示例01',2.36,[10,12,9,16,19,17,22,21,26,30,27,35,32,39,41,38,45,48]],['软件开发','BK示例02',1.82,[15,12,17,15,22,24,20,28,25,30,34,29,33,38,34,41,39,43]],['电池','BK示例03',-0.68,[40,37,42,35,32,36,31,29,33,26,29,25,21,24,20,23,19,22]],['通信设备','BK示例04',1.25,[18,22,19,17,23,21,27,25,30,28,26,32,30,35,33,39,37,41]],['证券','BK示例05',0.42,[25,23,27,24,28,26,30,27,29,26,30,28,33,29,32,31,34,33]],['光伏设备','BK示例06',-1.14,[49,44,46,40,42,37,39,32,35,30,28,31,25,23,26,21,23,18]]];
const stocks=[['示例科技 A','DEMO01',26.80,3.42,5.26],['示例电子 B','DEMO02',48.32,2.85,4.18],['示例通信 C','DEMO03',18.65,2.16,3.72],['示例软件 D','DEMO04',35.90,1.93,2.64],['示例能源 E','DEMO05',12.48,1.57,1.89],['示例制造 F','DEMO06',22.16,1.32,2.15]];
const fmt=n=>(n>=0?'+':'')+n.toFixed(2)+'%';
function renderCards(tab){document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.id===tab));document.getElementById('hint').textContent=tab==='boards'?'A 股 · 当天分时走势':tab==='rapid'?'近 5 分钟涨幅 · 正式版每 30 秒刷新':'热门股票 · 今日涨幅';document.getElementById('grid').innerHTML=tab==='boards'?boards.map(([name,code,pct,v])=>`<div class="card"><div class="row"><div><div class="name">${name}</div><div class="code">${code}</div></div><div class="pct ${pct>=0?'up':'down'}">${fmt(pct)}</div></div><svg class="chart ${pct>=0?'up':'down'}" viewBox="0 0 340 66" preserveAspectRatio="none" role="img" aria-label="示例当日分时走势"><path d="M0 63H340" fill="none" stroke="#e5e8ee"/><polyline points="${v.map((n,i)=>`${i/(v.length-1)*340},${62-n}`).join(' ')}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><div class="ticks"><span>09:30</span><span>11:30 / 13:00</span><span>15:00</span></div><div class="caption">当日分时 · 示例截至 14:50</div></div>`).join(''):stocks.map(([name,code,price,rapid,daily])=>`<div class="card row"><div><div class="name">${name}</div><div class="code">${code} · 示例股票</div></div><div class="num"><div>${price.toFixed(2)}</div><div class="up pct" style="margin-top:6px">${fmt(tab==='rapid'?rapid:daily)}${tab==='rapid'?' / 5分钟':''}</div>${tab==='rapid'?`<div class="caption">今日 ${fmt(daily)}</div>`:''}</div></div>`).join('')}
const colors=['#6366f1','#ef476f','#16a085','#f59e0b','#0ea5e9','#a855f7'];
const hidden=new Set();
function render(tab){
 renderCards(tab);
 document.getElementById('grid').style.display='';
 const old=document.getElementById('comparison');if(old)old.remove();
 if(tab!=='boards')return;
 const grid=document.getElementById('grid');grid.style.display='none';
 const box=document.createElement('div');box.id='comparison';
 const y=p=>190-p*48;
 box.innerHTML=`<h3 style="margin:0 0 8px">板块当日走势对比</h3><p style="font-size:12px;margin:0 0 20px">相对昨收涨跌幅 · 点击图例显示 / 隐藏板块 · 示例数据</p><div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px">${boards.map(([name,code,pct],i)=>`<button data-index="${i}" style="opacity:${hidden.has(i)?'.35':'1'};background:#f6f7fb"><span style="color:${colors[i]}">●</span> ${name} <span style="color:${colors[i]}">${fmt(pct)}</span></button>`).join('')}</div><svg viewBox="0 0 860 300" style="width:100%;display:block" role="img" aria-label="板块当日涨跌幅对比示例">${[-1,0,1,2,3].map(t=>`<line x1="50" x2="830" y1="${y(t)}" y2="${y(t)}" stroke="${t===0?'#a7acb8':'#e9ebf0'}" stroke-dasharray="${t===0?'5 5':'0'}"/><text x="42" y="${y(t)+4}" text-anchor="end" fill="#8c93a1" font-size="12">${t}%</text>`).join('')}${boards.map(([name,code,pct,v],i)=>hidden.has(i)?'':`<polyline points="${v.map((n,j)=>`${50+j/(v.length-1)*740},${y((n-v[0])/(v[v.length-1]-v[0])*pct)}`).join(' ')}" fill="none" stroke="${colors[i]}" stroke-width="2.5" stroke-linejoin="round"><title>${name}</title></polyline>`).join('')}<text x="50" y="280" fill="#9299a5" font-size="12">09:30</text><text x="440" y="280" text-anchor="middle" fill="#9299a5" font-size="12">11:30 / 13:00</text><text x="830" y="280" text-anchor="end" fill="#9299a5" font-size="12">15:00</text></svg><div class="caption">当日分时 · 示例截至 14:50</div>`;
 grid.before(box);box.querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.index);hidden.has(i)?hidden.delete(i):hidden.add(i);render('boards')});
}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>render(b.id));render('boards');
</script></body></html>
